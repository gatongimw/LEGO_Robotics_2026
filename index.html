<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plastic-Free Seas | LEGO Robotics Biodiversity Project</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="site-style">
:root{
  --navy:#0a2342; --deep:#123c69; --teal:#1b7f8c; --turq:#36c2c6; --aqua:#d6f5f4;
  --sand:#f6eedc; --sand2:#eadcbc; --ink:#13243a; --muted:#4d6075; --coral:#ef6f50;
  --lego-red:#d0101a; --lego-yellow:#f5c518; --lego-blue:#0d69ab; --white:#fff;
  --radius:18px; --shadow:0 10px 30px rgba(10,35,66,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--sand);line-height:1.6;font-size:17px}
h1,h2,h3,h4{font-family:Fredoka,Nunito,sans-serif;line-height:1.15;margin:0 0 .5em}
a{color:var(--teal)}
img{max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
section{scroll-margin-top:76px;padding:72px 0}
.loading{padding:120px 20px;text-align:center;color:var(--muted)}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(10,35,66,.96);backdrop-filter:blur(6px);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.2)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:Fredoka;font-weight:600;font-size:1.1rem;white-space:nowrap}
.nav ul{list-style:none;display:flex;gap:4px;margin:0 0 0 auto;padding:0}
.nav ul a{color:#dff6f6;text-decoration:none;padding:8px 10px;border-radius:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.nav ul a:hover{background:rgba(54,194,198,.22);color:#fff}
.menu-btn{display:none;margin-left:auto;background:none;border:2px solid #36c2c6;color:#fff;border-radius:10px;padding:6px 12px;font:700 .95rem Nunito;cursor:pointer}
.edit-toggle{background:var(--lego-yellow);color:var(--navy);border:0;border-radius:10px;padding:8px 14px;font:800 .9rem Nunito;cursor:pointer;white-space:nowrap}
@media (max-width:1240px){
  .menu-btn{display:block}
  .nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--navy);padding:10px 16px 18px}
  .nav ul.open{display:flex}
  .nav ul a{display:block;padding:12px}
}

/* HERO */
.hero{position:relative;color:#fff;background:linear-gradient(180deg,#0a2342 0%,#123c69 55%,#1b7f8c 100%);padding:0;overflow:hidden}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:70px;padding-bottom:40px}
.hero-art{position:absolute;inset:auto 0 0 0;z-index:1;line-height:0}
.hero-art svg{width:100%;height:auto;display:block}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);margin:18px 0 14px}
.hero p.lead{font-size:1.15rem;color:#d6f5f4;max-width:620px}
.hero .team{margin-top:6px;font-weight:700;color:var(--lego-yellow)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font-family:Nunito;font-size:1rem}
.btn-yellow{background:var(--lego-yellow);color:var(--navy);box-shadow:0 4px 0 #b88f00}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4)}
.problem-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius);padding:22px;backdrop-filter:blur(4px)}
.problem-card h3{color:var(--lego-yellow);font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em}
.hero-spacer{height:clamp(120px,20vw,260px)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-sky{display:none}}

/* LEGO bits */
.brick{display:inline-block;position:relative;width:34px;height:20px;border-radius:4px;background:var(--lego-red);margin-top:8px;vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brick::before,.brick::after{content:"";position:absolute;top:-6px;width:10px;height:7px;border-radius:3px 3px 0 0;background:inherit;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.brick::before{left:5px}.brick::after{right:5px}
.brick.y{background:var(--lego-yellow)}.brick.b{background:var(--lego-blue)}.brick.t{background:var(--turq)}
.studs{height:22px;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.55) 0 5px,transparent 6px) 0 0/28px 22px,var(--lego-yellow)}
.studs.blue{background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.35) 0 5px,transparent 6px) 0 0/28px 22px,var(--teal)}
.sec-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:10px}
.sec-head h2{font-size:clamp(1.8rem,3.6vw,2.6rem);margin:0;color:var(--navy)}
.sec-kicker{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--teal)}
.sec-intro{max-width:780px;color:var(--muted);font-size:1.08rem;margin-bottom:30px}
.dark{background:var(--navy);color:#eaf7f7}
.dark .sec-head h2{color:#fff}.dark .sec-intro{color:#bfe3e4}.dark .sec-kicker{color:var(--turq)}
.tint{background:linear-gradient(180deg,#e6f6f5,#d6f0ef)}
.white{background:#fff}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border-top:8px solid var(--turq);position:relative}
.stat:nth-child(2){border-color:var(--lego-yellow)}.stat:nth-child(3){border-color:var(--coral)}.stat:nth-child(4){border-color:var(--lego-blue)}
.stat b{display:block;font-family:Fredoka;font-size:2.4rem;color:var(--navy);line-height:1}
.stat span{display:block;margin-top:8px;font-weight:600}
.stat small{display:block;margin-top:8px;color:var(--muted);font-size:.8rem}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.stats{grid-template-columns:1fr}}

/* Cards / layout */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.infocard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.infocard .art{line-height:0;background:var(--aqua)}
.infocard .art svg{width:100%;height:auto}
.infocard .body{padding:20px 22px}
.infocard h3{color:var(--navy);font-size:1.25rem}
.figure{margin:0 0 26px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{padding:14px 20px;color:var(--muted);font-size:.92rem;border-top:1px solid #eef2f5}
.src{font-size:.8rem;color:var(--muted)}
.src a{color:inherit}
.dark .src{color:#9fc6c8}

/* Fact list */
.facts{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.facts li{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(10,35,66,.07)}
.facts .ico{flex:0 0 38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;background:var(--aqua)}

/* Photo slots */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 34px}
@media (max-width:900px){.slots{grid-template-columns:1fr}}
.slot{margin:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.slot-media{position:relative;aspect-ratio:4/3;background:var(--aqua);line-height:0;overflow:hidden}
.slot-media svg,.slot-media img{width:100%;height:100%;object-fit:cover;display:block}
.slot-tag{position:absolute;left:10px;top:10px;background:rgba(10,35,66,.82);color:#fff;font:800 .72rem Nunito;padding:4px 9px;border-radius:999px;line-height:1.4;letter-spacing:.03em}
.slot figcaption{padding:12px 16px 14px;font-size:.9rem;color:var(--muted)}
.slot figcaption strong{color:var(--ink)}
.slot .credit{display:block;font-size:.78rem;margin-top:4px;font-style:italic}
.slot-tools{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.slot-tools input[type=text]{flex:1 1 100%;padding:8px 10px;border:2px dashed #9fd9db;border-radius:10px;font:600 .85rem Nunito}
.mini{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:800 .82rem Nunito;cursor:pointer}
.mini.alt{background:#e7eef3;color:var(--ink)}
.logo-slot .slot-media{aspect-ratio:3/1}

/* Essays */
.essay{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.essay-top{padding:26px 30px;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.essay-top.birds{background:linear-gradient(120deg,#123c69,#1b7f8c)}
.essay-top.sharks{background:linear-gradient(120deg,#0a2342,#0d69ab)}
.essay-top .label{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--lego-yellow)}
.essay-top h3{font-size:clamp(1.4rem,3vw,2rem);margin:6px 0 4px}
.essay-top .by{color:#d6f5f4;font-weight:700}
.essay-body{padding:30px clamp(20px,4vw,56px) 36px;font-size:1.06rem;max-width:900px}
.essay-body p{margin:0 0 1.2em;text-indent:2em}
.pnum{display:block;font:800 .72rem Nunito;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;text-indent:0}
.ph{border:2.5px dashed #8fd3d6;background:#f2fbfb;border-radius:14px;padding:16px 18px;margin:0 0 16px;color:#3b7f86;font-weight:700}
.ph small{display:block;font-weight:600;color:var(--muted)}
.ph.dark-ph{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);color:#fff}
.works{border-top:2px solid #eef2f5;padding-top:16px;margin-top:10px;font-size:.92rem;color:var(--muted);white-space:pre-wrap}

/* Edit fields */
.field{margin-bottom:18px}
.field label{display:block;font-weight:800;color:var(--navy);margin-bottom:6px}
.field .hint{display:block;font-weight:600;color:var(--muted);font-size:.85rem;margin-top:-2px;margin-bottom:6px}
.field textarea,.field input{width:100%;padding:12px 14px;border:2.5px solid #9fd9db;border-radius:12px;font:500 1rem Nunito;color:var(--ink);background:#fbffff;resize:vertical}
.field textarea:focus,.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(54,194,198,.22)}
.essay-top .field label{color:#fff}
.essay-top input{background:rgba(255,255,255,.95)}
.splitter{background:#fff8e1;border:2px solid var(--lego-yellow);border-radius:14px;padding:16px;margin-bottom:22px}
.splitter p{margin:0 0 8px;font-weight:700;text-indent:0}

/* Research worksheet */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.rgrid{grid-template-columns:1fr}}
.rcard{background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(10,35,66,.08);padding:18px 20px;border-left:8px solid var(--turq);position:relative}
.rcard.wide{grid-column:1/-1}
.rcard:nth-child(4n+2){border-color:var(--lego-yellow)}.rcard:nth-child(4n+3){border-color:var(--coral)}.rcard:nth-child(4n+4){border-color:var(--lego-blue)}
.rcard h4{font-size:1.08rem;color:var(--navy);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.rcard .num{flex:0 0 28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 .85rem Fredoka}
.rcard .answer{white-space:pre-wrap}
.blank{display:block;border-bottom:2.5px dashed #8fd3d6;color:#5b9ca2;font-style:italic;padding:6px 0;font-weight:600}

/* Orgs */
.orgs{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media (max-width:900px){.orgs{grid-template-columns:1fr}}
.org{background:#fff;color:var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.org-head{display:flex;gap:16px;align-items:center;padding:20px 22px;color:#fff}
.org-badge{flex:0 0 64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;font:700 1.25rem Fredoka;overflow:hidden}
.org-badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.org-head h3{margin:0;font-size:1.35rem}
.org-head .meta{font-size:.85rem;opacity:.85;font-weight:700}
.org-body{padding:18px 22px 22px;flex:1;display:flex;flex-direction:column}
.org-body h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin:14px 0 6px}
.org-body ul{margin:0;padding-left:20px}
.org-body li{margin-bottom:5px}
.org-link{margin-top:auto;padding-top:16px}
.org-tools{padding:0 22px 16px;display:flex;gap:8px;flex-wrap:wrap}

/* Solutions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.actions{grid-template-columns:1fr 1fr}}
.action{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(10,35,66,.08);position:relative;padding-top:30px}
.action .em{font-size:2rem;line-height:1}
.action h4{margin:10px 0 6px;color:var(--navy)}
.action p{margin:0;font-size:.92rem;color:var(--muted)}
.action::before{content:"";position:absolute;top:0;left:0;right:0;height:14px;border-radius:16px 16px 0 0;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.5) 0 4px,transparent 5px) 0 0/24px 14px,var(--lego-yellow)}
.action:nth-child(3n+2)::before{background-color:var(--turq)}
.action:nth-child(3n+3)::before{background-color:var(--coral)}
.robot-box{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center;background:linear-gradient(120deg,#fff8e1,#fff);border:3px solid var(--lego-yellow);border-radius:22px;padding:26px;margin-top:34px}
@media (max-width:700px){.robot-box{grid-template-columns:1fr}}

/* Dashboard */
.dash{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.dash .panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.dash .panel.wide{grid-column:1/-1}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
.panel h3{color:var(--navy);font-size:1.25rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.panel svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid #9fd9db;background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font:800 .85rem Nunito;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.explain{background:var(--aqua);border-radius:12px;padding:12px 14px;font-weight:600;font-size:.95rem;margin-top:10px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.slider{margin-bottom:14px}
.slider label{display:flex;justify-content:space-between;font-weight:800;color:var(--navy);font-size:.95rem}
.slider label output{background:var(--lego-yellow);border-radius:8px;padding:0 9px;min-width:34px;text-align:center}
.slider input{width:100%;accent-color:var(--teal)}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.big{background:var(--sand);border-radius:14px;padding:14px}
.big b{display:block;font:600 1.9rem Fredoka;color:var(--navy);line-height:1.1}
.big span{font-size:.85rem;font-weight:700;color:var(--muted)}
.big.hl{background:#e3f6e9}.big.hl b{color:#1d7a43}
.ctable{width:100%;border-collapse:collapse;font-size:.95rem}
.ctable th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);padding:8px 6px;border-bottom:2px solid #e3eef2}
.ctable td{padding:8px 6px;border-bottom:1px solid #eef2f5;vertical-align:middle}
.ctable input{width:100%;padding:7px 8px;border:2px solid #9fd9db;border-radius:8px;font:600 .9rem Nunito}
.table-scroll{overflow-x:auto}

/* Sources */
.sources ol{padding-left:22px}
.sources li{margin-bottom:8px}

/* Footer */
footer{background:#071a33;color:#9fc6c8;padding:34px 0;font-size:.9rem}
footer a{color:#cdeff0}

/* Edit bar & banners */
.editbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.35);padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.editbar .status{font-weight:700;font-size:.9rem;color:#bfe3e4}
.editbar .btn{padding:9px 16px;font-size:.92rem}
.banner{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:90;background:#fff;color:var(--ink);border:3px solid var(--lego-yellow);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px);font-weight:700}
.toast{position:fixed;right:18px;bottom:18px;z-index:95;background:var(--teal);color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;box-shadow:var(--shadow)}
body.editing section{padding-bottom:90px}
.edit-note{background:#fff8e1;border:2px dashed var(--lego-yellow);border-radius:12px;padding:10px 14px;font-weight:700;color:#7a5b00;margin-bottom:20px}
</style>
</head>

<script type="application/json" id="site-data">{"v":1,"research":{"title":"Plastic-Free Seas.","problem":"Plastic pollution threatens the existence the animals in our oceans. To tackle this problem, we would like to raise awareness to help our ecosystems.","biodiversity":"Biodiversity is the variability of life on Earth in which can be measured on various levels. In Science class this year, we learned specifically about the impact of plastic pollution on different animals, which we connected to our innovation project.","causes":"We focused on two main ways plastic plastic pollution is caused. The first cause is discarded fishing gear that can be thrown into the ocean. The second cause is when single use plastic is thrown away which can enter the ocean and can stay there for hundreds of years.","ecosystems":"The disruption of an aquatic animal can then affect entire marine ecosystems. The fragile ecosystem can easily crumble if an important organism is disrupted by an outside source like plastics.","animals":"Seabirds, sharks, and other species are extremely vulnerable to plastic pollution. This is because these animals play an important roll in their ecosystem(s).","team":"Error 404","why":"Protecting Biodiversity is important because if sea animals aren't protected, then the whole food chain would be destroyed, and in most cases, fish would overpopulate, and the predators hunting them wouldn't be there to decrease the overpopulation.","solutions":"Possible solutions to plastic pollution include the use of reusable plastics. For example, something as simple as using reusable bags and cups could mean saving marine life. In addition, not throwing used fishing gear out in the ocean could really make an impact.","help":"Volunteering to help clean plastic in your community can help make a difference when an entire community is working together. As an individual, consciously limiting the use of plastic can help reduce plastic waste.","lego":"Our website connects to the LEGO Robotics Innovation Project through providing information about the problem of plastic pollution and ways to reduce plastic, saving our oceans.","stats":"Fun fact! Scientists predict that by 2050, 99% of seabird species will be eating plastic if trends continue.\nSource: Wilcox, Van Sebille & Hardesty, PNAS (2015).\n"},"essay1":{"title":"Pelican's Pollution","authors":"Bodie Norris, Everette Hatch, Tennyson Herring","paragraphs":["Plastic pollution is a huge problem in our oceans specifically in organisms like seabirds. In this research project we decided to focus on brown pelicans and how plastic pollution affects them. In this essay we will give facts on plastic pollution and information from studies as well as how you at home can help our pelicans keep flying.\n","Humans contribute to plastic pollution in many ways, first they overuse and discard dangerous single use plastic, second they don't make sure that plastic gets to the landfill. We can see evidence of this on iucn.org where they say that around one in 23 pieces of plastic make it into the ocean. This is a Disconcerting statistic because plastic damages our oceans. Plastic makes its way to our oceans in many ways but one way is littering, litter can be blown very far by the wind into bodies of water where it can hurt aquatic organisms ifaw.org. In conclusion, human activity is one of the main reasons plastic ends up in the \nocean.\n","After plastic flows or is dumped into the ocean it gets carried around by currents to several different countries and other oceans. Plastic breaks down at an extremely low rate and when it does it degrades into microplastics which can still poison food and water. It stays in the water and pollutes ecosystems. Plastic can hurt animals by them consuming it or getting caught/stuck in plastic items.\nPlastic after entering the water never comes out naturally and only continues to harm after entering the water.\n","So now all this plastic waste is in the water and it's not going anywhere. If you were a bird (like a pelican) and you saw a plastic bottle the same size and color as a fish you would swoop down and eat it. But it's a bottle and then it takes up most of your stomach. Worst of all when you try to fly away you realize you're tangled in a fishing net. It's not fun but unfortunately this happens to a lot of pelicans. Studies show that from a sample of over 90,000 sea birds two thirds of pelicans had ingested plastics. In conclusion plastic pollution poses a huge threat to pelicans.","If this problem continues, many sea bird species will likely become extinct or go endangered. It is estimated that 99% of sea birds will have ingested plastic into their system by 2050. Chemicals can hurt birds' immune systems and change their hormones. Less birds will be born because chicks get fed plastic and die early on in life because of plastic. If we don't slow or stop plastic pollution the future is grim for sea birds.","If we want to fix this problem we need to not just stop plastic pollution from continuing but also clean up the plastic out there, organizations like The ocean cleanup are working to remove and recycle plastic from the garbage patches in the oceans with their largest operations going on in the pacific. They use a trailing surface net to collect plastic from hotspots in the great pacific garbage patch and use drones and simulations to locate the largest concentrations. Another organization working to reduce plastic pollution is the plastic bank, an organization who establishes “branches” in vulnerable coastal communities where citizens can exchange marine waste for money, food tuition or health insurance. In conclusion, organizations like these are working hard to clean the plastic from our oceans and so should you.\n","Overall plastic pollution poses a huge threat to seabirds. If it continues some species like pelicans may become endangered or extinct. However we can support organizations like NOAA who are working toward reducing plastic waste. \n"],"sources":"Iunc.org\nIfaw.org\ntheoceancleanup.com\nplasticbank.com\n\n"},"essay2":{"title":"  Hammerhead Shark Pollution","authors":"Nathan Gatongi, Abel Worsley","paragraphs":["Our oceans have been impacted by microplastics for years and many microplastics will stay in the oceans for 100s more. These microplastics can have devastating effects on marine life. Sharks have a major part in the oceanic ecosystem. Microplastics can lead to devastating effects for them which can then affect other parts of the ecosystem. Therefore, we choose hammerhead sharks because they are a top predator in the ocean ecosystem and have a large effect on the general population of other marine life.","The activities and actions we take can heavily affect the use of plastics in the ocean which can then impact these hammerhead sharks. Fishing gear that is lost or discarded at sea can become a hazard for many different species of marine life such as hammerhead sharks. When people go out to sea and drop waste in the ocean it can become dangerous for these sharks. In addition, plastics can also attract and carry pollutants as well as releasing chemicals into the water. These human activities can highly impact the health of hammerheads and other marine life.","After human activities, the plastics enter the ocean. Once this happens it's extremely hard to track where the plastic goes but we do know that the plastic clumps together. Once this happens the clumps can release chemicals into the water. Some animals think that the plastic is food and eat it. The plastic then enters the food web as other animals eat the other.","Symptoms that occur when hammerhead sharks consume plastics can be severe and life threatening. Microplastics and larger plastic debris can cause different symptoms over time. When repeatedly consuming larger plastic debris or even microplastics when accumulated enough can cause a false sense of fullness causing starvation. Damage isn’t always physical, the chemicals ingested by some hammerhead sharks can cause neurological problems and lead to navigational issues. Most of these systems are so severe that they will most likely lead to death.","So why should you care about this? Well our oceans food web depends on sharks and large predators like them to continue to stay healthy and operate normally. Therefore, if a large predator leaves the food web other animals that are eaten daily by them will overproduce and this will cause major issues in the food web. For example, Hammerhead Sharks eat a ton of stingrays and when they overproduce the shellfish supply dramatically goes down due to that being the main food source. This would cause a shortage worldwide of them.","The effect of plastic pollution doesn't just impact a specific organism, plastic pollution can cause a chain of connected effects that affect multiple different parts of the marine environment. Pollution can change the habitat where hammerhead sharks live by both contaminating and or killing off their food sources which can make it harder to get the nutrients they need to survive. Two other organisms that could be affected by plastic pollution in the habitat are the Sea Turtles and the Seabirds which are very easily affected by the effects on the hammerhead sharks because an impact on one organism almost always has a changing effect on most of the rest of that aquatic ecosystem. An example of a chain reaction that could happen would be that if plastic enters the ocean then it can potentially lead to chemical poisoning for the food of any of these animals which can be really harmful. These dangerous chain reactions can lead to chunks of the aquatic ecosystem falling apart.","People have noticed and seen the mass plastic problem in the ocean and are taking actions against it. One organization that has stepped up the cause is The Ocean Cleanup, a group devoted to solving the issue. One action they are taking, is developing solutions such as massive offshore barriers that trap and clump trash for easy cleanup. The group is also looking into rivers because they are the main transportation for trash out in the ocean. The group hopes to solve the issue and keep our oceans clean.\n\nSo what can you do? Those plastic bags you get at the grocery store take 100s of years to break down on the earth and just sit for no one to use them. This plastic is the very thing that pollutes rivers, oceans, and streams. So next time you go to the grocery store bring a reusable bag. Or just reuse your plastic bags!"],"sources":"theoceancleanup.com"},"photos":{"sh-3":{"id":"e98780d62ac21a593d19118a05a35e0f","caption":"This image shows microplastics up close.","credit":"Stanford Report-Stanford University."},"sh-1":{"id":"b0c145b0a6c01dd19ee1b8b32867872e","caption":"This image shows a hammerhead shark swimming in the ocean.","credit":"A-Z Animals"},"sh-2":{"id":"3030a45d4d9879c043df3479b88e44df","caption":"This image shows a shark searching for prey.","credit":"Australian Geographic"},"sb-1":{"id":"a32dc1a1bde6965f07899c979a1feae7","caption":"This image shows a Brown Pelican in flight.","credit":"https://etsy.com"},"sb-2":{"id":"f5729a712632acbc09e455f01c37c976","caption":"This image shows a seabird tangled in fishing line or a plastic bag.","credit":"vecteezy.com"},"sb-3":{"id":"7170137bd9523219a41632d4d17a82b3","caption":"This image shows plastic trash on a beach where seabirds nest.","credit":"dreamstime.com"}},"cleanups":[]}</script>

function wrapText(t,cx,y,maxChars,size){
  var words=t.split(' '),lines=[],cur='';
  words.forEach(function(w){if((cur+' '+w).trim().replace(/&amp;/g,'&').length>maxChars){lines.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())lines.push(cur.trim());
  return lines.map(function(l,i){return '<text x="'+cx+'" y="'+(y+i*(size+5))+'" text-anchor="middle" font-family="Nunito" font-weight="600" font-size="'+size+'" fill="#4d6075">'+l+'</text>';}).join('');
}

function wrapLeft(t,x,y,maxChars,size){

    e.paragraphs.forEach(function(p,i){
      html+='<div class="field"><label>Paragraph '+(i+1)+' <span class="src">('+PROLES[i]+')</span></label><textarea rows="6" data-k="'+key+'.paragraphs.'+i+'" placeholder="Paste student writing for paragraph '+(i+1)+'">'+esc(p)+'</textarea></div>';
    });
    html+='<div class="field"><label>Works cited / sources used in this essay</label><textarea rows="4" data-k="'+key+'.sources" placeholder="One source per line">'+esc(e.sources)+'</textarea></div>';
  }else{
    e.paragraphs.forEach(function(p,i){
      if(p.trim()) html+='<p><span class="pnum">Paragraph '+(i+1)+'</span>'+esc(p.trim()).replace(/\n+/g,'<br>')+'</p>';
      else html+='<div class="ph">✏️ Paragraph '+(i+1)+' · '+PROLES[i]+'<small>Student writing goes here.</small></div>';

function chartBirds(){
  var pts=[[1960,5],[2010,80],[2015,90]],W=560,H=280,x0=60,x1=W-30,y0=230,ys=190/100;
  function X(yr){return x0+(yr-1955)/(2020-1955)*(x1-x0);}

  [0,25,50,75,100].forEach(function(g){var y=y0-g*ys;out+='<line x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'" stroke="#e3eef2"/><text x="'+(x0-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" font-family="Nunito" fill="#4d6075">'+g+'%</text>';});
  [1960,1970,1980,1990,2000,2010,2020].forEach(function(yr){out+='<text x="'+X(yr)+'" y="'+(y0+20)+'" text-anchor="middle" font-size="12" font-family="Nunito" fill="#4d6075">'+yr+'</text>';});
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0])+' '+(y0-p[1]*ys);}).join(' ');

   ['🤖','Innovate','Design robots and tools that find, sort or collect plastic, like our LEGO project!']
  ];
  return '<section id="solutions" class="white"><div class="wrap">'+
   '<div class="sec-kicker">Solutions</div><div class="sec-head"><h2>What a Difference Protection Makes</h2><span class="brick t" aria-hidden="true"></span></div>'+
   '<p class="sec-intro">Cleaning up trash, stopping new plastic at its source and protecting special ocean areas let habitats recover. Compare a polluted habitat with a protected one:</p>'+
   '<figure class="figure">'+infoBeforeAfter()+'<figcaption>Before and after: plastic-choked water supports little life, while protected, clean habitats are full of coral, fish, sharks and seabirds. Marine protected areas, like Blue Parks, give wildlife room to recover.</figcaption></figure>'+
   '<h3 style="color:var(--navy);margin-top:36px">8 ways people can reduce plastic pollution</h3><div class="actions">'+
   acts.map(function(a){return '<div class="action"><div class="em">'+a[0]+'</div><h4>'+a[1]+'</h4><p>'+a[2]+'</p></div>';}).join('')+'</div>'+
   '<div class="robot-box"><div>'+artRobot()+'</div><div><div class="sec-kicker">Our innovation</div><h3 style="color:var(--navy);font-size:1.6rem">How robotics can help</h3>'+
   '<p>Real-world cleanup technology, like The Ocean Cleanup’s solar-powered river Interceptors, uses sensors, motors and automation, the same ideas we use when we build and program LEGO robots.</p>'+
   (researchVal('lego')?'<p><b>Our project:</b> '+esc(researchVal('lego'))+'</p>':'<div class="ph">✏️ Our LEGO robotics connection<small>Fill in question 11 on the <a href="#research">research worksheet</a> and it will appear here.</small></div>')+
   '</div></div>'+
   '<div class="slots" style="grid-template-columns:1fr;max-width:480px;margin:30px auto 0">'+slot('team-robot',artRobot,'Our robot','Suggested photo: your team with your LEGO robot or prototype')+'</div>'+
  '</div></section>';
}

function sources(){
  return '<section id="sources" class="tint sources"><div class="wrap">'+
   '<div class="sec-kicker">Credible sources</div><div class="sec-head"><h2>Sources &amp; Further Reading</h2><span class="brick b" aria-hidden="true"></span></div>'+
   '<p class="sec-intro">Facts on this website come from these scientific studies and organizations. Student essays list their own sources under each essay.</p>'+
   '<div class="card"><ol>'+SOURCES.map(function(s){return '<li>'+esc(s[0])+' <a href="'+s[1]+'" target="_blank" rel="noopener">Link ↗</a></li>';}).join('')+'</ol>'+
   '<h4 style="color:var(--navy);margin-top:18px">Where to find free photos</h4><p style="margin:0">Public-domain wildlife photos: <a href="https://photolib.noaa.gov/" target="_blank" rel="noopener">NOAA Photo Library</a> and the <a href="https://digitalmedia.fws.gov/" target="_blank" rel="noopener">U.S. Fish &amp; Wildlife Service National Digital Library</a>. Always write who took the photo in the credit box.</p></div>'+
  '</div></section>';
}

function footer(){
  return '<footer><div class="studs" style="margin:-34px 0 26px"></div><div class="wrap" style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><b style="color:#fff;font-family:Fredoka;font-size:1.1rem">Plastic-Free Seas</b><br>A LEGO Robotics Innovation Project on biodiversity and ocean plastic pollution.</div><div>Illustrations are simplified drawings made for this site.<br>Essays are the original work of our students.'+(FILE_MODE&&!editMode?'<br><button class="mini alt" id="fileEdit" style="margin-top:10px">\u270f\ufe0f Team edit mode</button>':'')+'</div></div></footer>';
}

function editBar(){
  if(!editMode) return '';
  return '<div class="editbar" id="editbar"><span class="status" id="editStatus"></span><button class="btn btn-ghost" id="cancelEdit">Discard changes</button><button class="btn btn-yellow" id="saveBtn">'+(FILE_MODE?'\u2b07 Download updated website':'Save &amp; publish')+'</button></div>';
}

function countBlanks(){
  var n=0;['essay1','essay2'].forEach(function(k){state[k].paragraphs.forEach(function(p){if(!p.trim())n++;});if(!state[k].title.trim())n++;if(!state[k].authors.trim())n++;});
  RESEARCH.forEach(function(r){if(!researchVal(r[0]))n++;});return n;
}
function updateStatus(msg){
  var el=document.getElementById('editStatus'); if(!el) return;
  el.textContent=msg||((dirty?(FILE_MODE?'Not downloaded yet · ':'Unsaved changes · '):'No changes yet · ')+countBlanks()+' blanks left');
}

function render(){
  var y=window.scrollY;
  document.body.classList.toggle('editing',editMode);
  document.getElementById('app').innerHTML=nav()+home()+problem()+dashboard()+seabirds()+sharks()+research()+organizations()+solutions()+sources()+footer()+editBar();
  updateStatus();
  window.scrollTo(0,y);
}

/* ---------- events ---------- */
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({t:Date.now(),state:state}));}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function toast(msg,ms){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},ms||3200);}

document.addEventListener('input',function(ev){
  var ck=ev.target.getAttribute&&ev.target.getAttribute('data-calc');
  if(ck){calc[ck]=Number(ev.target.value);var o=document.getElementById('o-'+ck);if(o)o.textContent=calc[ck];var co=document.getElementById('calcOut');if(co)co.innerHTML=calcHTML();return;}
  var k=ev.target.getAttribute&&ev.target.getAttribute('data-k'); if(!k||!editMode) return;
  setPath(state,k,ev.target.value); dirty=true; saveDraft(); updateStatus();
});
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('button,a'):null; if(!t) return;
  if(t.id==='menuBtn'){var l=document.getElementById('navList');var o=l.classList.toggle('open');t.setAttribute('aria-expanded',o);return;}
  if(t.tagName==='A'&&t.closest('#navList')){document.getElementById('navList').classList.remove('open');}
  if(t.id==='editToggle'){
    if(editMode&&dirty){updateStatus('You have unsaved changes: Save & publish, or Discard.');return;}
    editMode=!editMode; render(); return;
  }
  if(t.id==='cancelEdit'){state=clone(DATA);dirty=false;clearDraft();editMode=false;render();toast('Changes discarded');return;}
  if(t.id==='saveBtn'){save();return;}
  if(t.id==='fileEdit'){canEdit=true;editMode=true;render();draftBanner();return;}
  var sc=t.getAttribute('data-scn');
  if(sc){scenario=sc;document.querySelectorAll('[data-scn]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-scn')===sc);});document.getElementById('flowChart').innerHTML=chartFlow();document.getElementById('flowText').textContent=SCN[sc].text;return;}
  if(t.getAttribute('data-addrow')){state.cleanups.push({date:'',place:'',pieces:'',top:''});dirty=true;saveDraft();render();return;}
  var dr=t.getAttribute('data-delrow');
  if(dr!=null){state.cleanups.splice(Number(dr),1);dirty=true;saveDraft();render();return;}
  var sp=t.getAttribute('data-split');
  if(sp){
    var txt=(document.getElementById('paste-'+sp).value||'').trim(); var msg=document.getElementById('split-msg-'+sp);
    if(!txt){msg.textContent='Paste the essay first.';return;}
    var parts=txt.split(/\n\s*\n/).map(function(s){return s.trim();}).filter(Boolean);
    if(parts.length<2) parts=txt.split(/\n/).map(function(s){return s.trim();}).filter(Boolean);
    if(parts.length>7){parts=parts.slice(0,6).concat([parts.slice(6).join('\n\n')]);}
    while(parts.length<7)parts.push('');
    state['essay'+sp].paragraphs=parts; dirty=true; saveDraft(); render();
    var m2=document.getElementById('split-msg-'+sp); if(m2) m2.textContent='Done! Check each paragraph box below.';
    return;
  }
  var up=t.getAttribute('data-upload'); if(up){pickPhoto(up);return;}
  var rm=t.getAttribute('data-remove');
  if(rm){var old=state.photos[rm];delete state.photos[rm];dirty=true;saveDraft();render();
    if(old&&old.id&&assetsApi&&!(DATA.photos[rm]&&DATA.photos[rm].id===old.id)){try{assetsApi.delete(old.id).catch(function(){});}catch(e){}}
    return;}
});

function shrinkImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var max=1400,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.8));};img.onerror=function(){cb(null);};img.src=fr.result;};
  fr.onerror=function(){cb(null);};fr.readAsDataURL(file);
}
function pickPhoto(slotId){
  if(FILE_MODE){
    var fi=document.createElement('input');fi.type='file';fi.accept='image/*';
    fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;updateStatus('Adding photo\u2026');
      shrinkImage(f,function(url){if(!url){toast('Could not read that image. Try a JPG or PNG.');updateStatus();return;}
        var prev=state.photos[slotId]||{};state.photos[slotId]={src:url,caption:prev.caption||'',credit:prev.credit||''};
        dirty=true;saveDraft();render();toast('Photo added. Remember to download the updated website.');});};
    fi.click();return;
  }
  if(!assetsApi) return;
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size>20*1024*1024){toast('That image is over 20 MB. Please use a smaller one.');return;}
    updateStatus('Uploading photo…');
    assetsApi.upload(f).then(function(r){
      var prev=state.photos[slotId]||{};
      state.photos[slotId]={id:r.id,caption:prev.caption||'',credit:prev.credit||''};
      dirty=true;saveDraft();render();toast('Photo added. Remember to Save & publish.');
    }).catch(function(e){updateStatus();toast('Upload failed: '+((e&&e.message)||'please try again'));});
  };
  inp.click();
}

function buildDocument(data){
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var css=document.getElementById('site-style').textContent;
  var code=document.getElementById('app-code').textContent;
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+HEAD_META+'\n<style id="site-style">'+css+'</style>\n</head>\n<body>\n<div id="app"><div class="loading">Loading the ocean…</div></div>\n<script type="application/json" id="site-data">'+json+SCRIPT_CLOSE+'\n<script id="app-code">'+code+SCRIPT_CLOSE+'\n</body>\n</html>\n';
}

function save(){
  if(saving) return;
  if(FILE_MODE){
    var data0=normalize(clone(state));
    try{
      var blob=new Blob([buildDocument(data0)],{type:'text/html'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plastic-free-seas.html';
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
      DATA=clone(data0);dirty=false;clearDraft();updateStatus('Downloaded! Share or upload the new file.');
      toast('Downloaded plastic-free-seas.html. Upload it to replace the old version of your site.',7000);
    }catch(e){toast('Download failed: '+(e&&e.message||'try another browser'),6000);}
    return;
  }
  if(!artifactApi){toast('Saving isn’t available in this view. Open the site from its claude.ai page.');return;}
  saving=true; updateStatus('Publishing…');
  var data=normalize(clone(state));
  try{sessionStorage.setItem('lr-after-save',JSON.stringify({y:window.scrollY}));}catch(e){}
  clearDraft();
  artifactApi.publish(buildDocument(data)).then(function(){
    saving=false; DATA=clone(data); dirty=false; updateStatus('Published! Reloading…');
  }).catch(function(e){
    saving=false; saveDraft();
    try{sessionStorage.removeItem('lr-after-save');}catch(x){}
    var code=e&&e.code;
    if(code==='conflict'){toast('Someone else published at the same time. The page will reload; your edits are kept as a draft.',6000);}
    else if(code==='not_granted'||code==='not_writer'){toast('You don’t have permission to edit this site.',5000);}
    else{toast('Could not publish: '+((e&&e.message)||'please try again'),6000);}
    updateStatus();
  });
}

function draftBanner(){
  var d=null;try{d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');}catch(e){}
  if(!d||!d.state) return;
  if(JSON.stringify(normalize(d.state))===JSON.stringify(DATA)){clearDraft();return;}
  var b=document.createElement('div');b.className='banner';
  b.innerHTML='<span>You have unsaved edits from '+new Date(d.t).toLocaleString()+'.</span><button class="mini" id="restoreDraft">Restore them</button><button class="mini alt" id="dropDraft">Discard</button>';
  document.body.appendChild(b);
  b.querySelector('#restoreDraft').onclick=function(){state=normalize(d.state);dirty=true;editMode=true;b.remove();render();};
  b.querySelector('#dropDraft').onclick=function(){clearDraft();b.remove();};
}

/* ---------- boot ---------- */
render();
try{var after=JSON.parse(sessionStorage.getItem('lr-after-save')||'null');if(after){sessionStorage.removeItem('lr-after-save');clearDraft();setTimeout(function(){window.scrollTo(0,after.y||0);toast('Saved and published ✓');},60);}}catch(e){}
if(location.hash){setTimeout(function(){var el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();},80);}

if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([
    window.claude.use('artifact').catch(function(){return null;}),
    window.claude.use('assets').catch(function(){return null;}),
    window.claude.use('user').catch(function(){return null;})
  ]).then(function(r){
    artifactApi=r[0]; assetsApi=r[1]; var user=r[2];
    if(!artifactApi) return;
    var check=user&&typeof user.canEdit==='function'?Promise.resolve(user.canEdit()).catch(function(){return null;}):Promise.resolve(null);
    return check.then(function(ok){
      canEdit = ok===true || (ok==null && !!assetsApi);
      if(canEdit){render();draftBanner();}
    });
  });
}
})();
</script>
